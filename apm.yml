name: viperwow-awesome-marketplace
version: 0.1.0
description: Curated third-party skills, plugins, hooks and MCP servers for Claude
  Code, Codex and Cursor.
author: Viperwow
targets:
- claude
- codex
- cursor
dependencies:
  apm:
  - DietrichGebert/ponytail
  - mksglu/context-mode
  - JuliusBrussee/caveman
  - git: https://github.com/obra/superpowers
  - anthropics/claude-plugins-official/plugins/hookify
  mcp: []
marketplace:
  description: Curated third-party skills, plugins, hooks and MCP servers for Claude
    Code, Codex and Cursor.
  owner:
    name: Viperwow
    url: https://github.com/Viperwow
  outputs:
    claude: {}
    codex: {}
  packages:
  - category: Productivity
    name: ponytail
    description: 'Ponytail 5 makes AI coding agents write the least code that works.
      Rebuilt from the ground up: 53% less code, 41% faster, 26% cheaper, 45% fewer
      tokens, and 98% of risky logic ships with a test.'
    source: DietrichGebert/ponytail
    ref: 16352ac229eb08a9598dcae48fe9f2b342567d86
  - category: Productivity
    name: context-mode
    description: 'Keeps long sessions sharp: raw tool output stays out of the context
      window (98% smaller), and session memory survives compaction, so your agent
      never loses track of files, tasks or your last ask.'
    source: mksglu/context-mode
    ref: 5f6298a9bdc480ebc7c88a29c9fbdf38ae2f8cb6
  - category: Productivity
    name: caveman
    description: 'Makes your agent answer in short, dense replies instead of walls
      of text: you read faster and pay for fewer tokens, with no measurable quality
      loss in JetBrains'' 86-task A/B test.'
    source: JuliusBrussee/caveman
    ref: 81958ad82f2e2da4417778f81f8a3c838d81b798
  - category: Productivity
    name: superpowers
    description: '15 skills that make your agent work like a disciplined engineer:
      brainstorm, spec, plan, test first, review. Spec-driven development out of the
      box.'
    source: obra/superpowers
    ref: bb92a77741419a4ab5f06e711a283343f1ada0c3
  - category: Productivity
    name: hookify
    description: 'Turns your agent''s bad habits into guardrails: describe the behavior
      in plain words, and a hook warns about it or blocks it from then on. No code,
      no hooks.json.'
    source: https://github.com/anthropics/claude-plugins-official
    subdir: plugins/hookify
    ref: ea10b213686c90bb1984b2016937310e05336cf3
