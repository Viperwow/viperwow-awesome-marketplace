name: viperwow-awesome-marketplace
version: 0.1.0
description: Curated third-party skills, plugins, hooks and MCP servers for Claude
  Code, Codex and Cursor.
author: Viperwow
targets:
- claude
- codex
- cursor
dependencies:
  apm:
  - DietrichGebert/ponytail
  - mksglu/context-mode
  - JuliusBrussee/caveman
  - git: https://github.com/obra/superpowers
  - anthropics/claude-plugins-official/plugins/hookify
  mcp: []
marketplace:
  description: Curated third-party skills, plugins, hooks and MCP servers for Claude
    Code, Codex and Cursor.
  owner:
    name: Viperwow
    url: https://github.com/Viperwow
  outputs:
    claude: {}
    codex: {}
  packages:
  - category: Productivity
    name: ponytail
    description: 'Ponytail 5 makes AI coding agents write the least code that works.
      Rebuilt from the ground up: 53% less code, 41% faster, 26% cheaper, 45% fewer
      tokens, and 98% of risky logic ships with a test.'
    source: DietrichGebert/ponytail
    ref: 16352ac229eb08a9598dcae48fe9f2b342567d86
  - category: Productivity
    name: context-mode
    description: The control plane between your coding agents and models. Spend less
      on context, remember across sessions, and run only what you allow.
    source: mksglu/context-mode
    ref: 5f6298a9bdc480ebc7c88a29c9fbdf38ae2f8cb6
  - category: Productivity
    name: caveman
    description: Caveman makes your AI agent say less and read less. Install the skill
      for shorter answers, or the CLI proxy to cut input tokens by 33.2%.
    source: JuliusBrussee/caveman
    ref: 81958ad82f2e2da4417778f81f8a3c838d81b798
  - category: Productivity
    name: superpowers
    description: An agentic skills framework & software development methodology that
      works.
    source: obra/superpowers
    ref: bb92a77741419a4ab5f06e711a283343f1ada0c3
  - category: Productivity
    name: hookify
    description: Easily create hooks to prevent unwanted behaviors by analyzing conversation
      patterns
    source: https://github.com/anthropics/claude-plugins-official
    subdir: plugins/hookify
    ref: ea10b213686c90bb1984b2016937310e05336cf3
